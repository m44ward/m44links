<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base target="_top">
<title>Your Sign-up · Mapleton 44th Ward</title>
<meta property="og:title" content="Mapleton 44th Ward · Your Sign-up">
<meta property="og:type" content="website">
<style>
:root {
  /* Recolour here: every colour on the pages comes from these. */
  --gp-ink: #2c3a4a;
  --gp-heading: #1d3557;
  --gp-accent: #c9b882;
  --gp-muted: #5b6776;
  --gp-link: #4a6fa5;
  --gp-page: #eef2f7;
  --gp-card: #ffffff;
  --gp-line: #dde3ed;
  --gp-soft: #f4f7fc;
  --gp-good: #2f7d4f;
  --gp-warn: #a4472b;
  --gp-bar: #4a6fa5;
  --gp-font: Georgia, 'Times New Roman', serif;
  /* The ward's look (Settings theme_*): --gp-bg, --gp-panel, --gp-panel-radius, --gp-panel-pad,
     --gp-panel-top, --gp-button and --gp-heading-font are set only by a theme; their fallbacks are the standard look. */
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--gp-font);
  color: var(--gp-ink);
  background-color: var(--gp-page);
  background-image: var(--gp-bg, none);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  line-height: 1.5;
  min-height: 100vh;
}
/* Phones: iOS ignores fixed backgrounds, so the picture scrolls with the page. */
@media (max-width: 760px) {
  body { background-attachment: scroll; }
}

/* With a background picture, text sits on a light panel so it stays readable. */
.gp-wrap, .gp-footer {
  background: var(--gp-panel, transparent);
  border-radius: var(--gp-panel-radius, 0);
}

.gp-wrap {
  max-width: 560px;
  margin: var(--gp-panel-top, 0) auto 0;
  padding: 1.5rem 1rem 3rem;
}

.gp-wrap.gp-wide { max-width: 760px; }

.gp-head { text-align: center; margin-bottom: 1.25rem; }
.gp-ward { font-size: 0.85rem; color: var(--gp-muted); letter-spacing: 0.02em; margin: 0; }
h1, h2, h3 { font-family: var(--gp-heading-font, var(--gp-font)); }
h1 { font-size: 1.4rem; color: var(--gp-heading); margin: 0.2rem 0 0; }
h2 {
  font-size: 1.05rem;
  color: var(--gp-heading);
  margin: 1.5rem 0 0.6rem;
  padding-bottom: 0.3rem;
  border-bottom: 2px solid var(--gp-accent);
}
h3 { font-size: 1rem; color: var(--gp-heading); margin: 0 0 0.3rem; }

a { color: var(--gp-link); overflow-wrap: anywhere; }

.gp-card {
  background: var(--gp-card);
  border: 1px solid var(--gp-line);
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(29, 53, 87, 0.07);
  padding: 0.9rem 1rem;
  margin: 0 0 0.75rem;
}

a.gp-card { display: block; text-decoration: none; color: inherit; }
a.gp-card:hover, a.gp-card:focus { background: var(--gp-soft); }

.gp-meta { font-size: 0.85rem; color: var(--gp-muted); margin: 0.1rem 0; }
.gp-note { white-space: pre-wrap; margin: 0.4rem 0; }

.gp-bar {
  height: 8px;
  border-radius: 4px;
  background: var(--gp-line);
  overflow: hidden;
  margin: 0.45rem 0 0.2rem;
}
.gp-bar > span { display: block; height: 100%; background: var(--gp-bar); }
.gp-count { font-size: 0.85rem; color: var(--gp-muted); }
.gp-filled { color: var(--gp-good); font-weight: bold; }
.gp-full { opacity: 0.75; }

.gp-btn, button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0.55rem 1rem;
  border-radius: 10px;
  border: 1px solid var(--gp-button, var(--gp-heading));
  background: var(--gp-button, var(--gp-heading));
  color: #ffffff;
  font: inherit;
  font-size: 0.95rem;
  cursor: pointer;
  text-decoration: none;
  margin: 0.2rem 0.3rem 0.2rem 0;
}
.gp-btn.gp-light, button.gp-light { background: var(--gp-card); color: var(--gp-button, var(--gp-heading)); }
.gp-btn.gp-danger, button.gp-danger { background: var(--gp-card); color: var(--gp-warn); border-color: var(--gp-warn); }
button:disabled { opacity: 0.55; cursor: default; }

label { display: block; font-size: 0.9rem; margin: 0.7rem 0 0.2rem; color: var(--gp-heading); }
input[type='text'], input[type='email'], input[type='number'], input[type='date'], input[type='time'], select, textarea {
  width: 100%;
  min-height: 44px;
  padding: 0.5rem 0.6rem;
  border: 1px solid var(--gp-line);
  border-radius: 8px;
  font: inherit;
  background: #ffffff;
  color: var(--gp-ink);
}
textarea { min-height: 88px; }
.gp-check { display: flex; align-items: center; gap: 0.5rem; margin: 0.35rem 0; font-size: 0.95rem; min-height: 44px; }
.gp-check input { width: 22px; height: 22px; }
.gp-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.gp-row > * { flex: 1 1 140px; }

.gp-error { color: var(--gp-warn); font-size: 0.88rem; margin: 0.25rem 0; }
.gp-ok { background: #eef7f1; border: 1px solid #b9dcc6; border-radius: 10px; padding: 0.8rem 1rem; }
.gp-alert { background: #fbf1ec; border: 1px solid #e7c2b3; border-radius: 10px; padding: 0.8rem 1rem; }
.gp-muted { color: var(--gp-muted); }
.gp-loading { color: var(--gp-muted); text-align: center; padding: 1.5rem 0; }
.gp-hidden { display: none !important; }

.gp-slot { border-top: 1px solid var(--gp-line); padding: 0.55rem 0; }
.gp-slot:first-child { border-top: none; }
.gp-person { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.6rem; padding: 0.3rem 0 0.3rem 0.8rem; }
/* Serve page: Brothers and Sisters side by side on wide screens, stacked on phones. */
.gp-pair { display: grid; grid-template-columns: 1fr; gap: 0 1rem; }
.gp-pair > .gp-section { min-width: 0; }
.gp-cat { font-size: 0.8rem; color: var(--gp-muted); margin: 0 0 0.2rem; text-transform: uppercase; letter-spacing: 0.04em; }
.gp-cat-icon { margin-right: 0.35rem; text-transform: none; }
@media (min-width: 720px) {
  .gp-pair { grid-template-columns: 1fr 1fr; }
}
.gp-tag { font-size: 0.78rem; background: var(--gp-soft); border: 1px solid var(--gp-line); border-radius: 999px; padding: 0.05rem 0.55rem; color: var(--gp-muted); }

.gp-tabs { display: flex; gap: 0.4rem; margin: 0.5rem 0 1rem; flex-wrap: wrap; }
.gp-tabs button { flex: 1 1 auto; }
.gp-tabs button[aria-selected='false'] { background: var(--gp-card); color: var(--gp-heading); }

.gp-date { background: var(--gp-soft); border: 1px solid var(--gp-line); border-radius: 12px; padding: 0.7rem; margin: 0.7rem 0; }
.gp-role { background: var(--gp-card); border: 1px solid var(--gp-line); border-radius: 10px; padding: 0.5rem 0.7rem; margin: 0.5rem 0; }

.gp-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
.gp-tile { text-align: center; padding: 1.1rem 0.6rem; min-height: 120px; }
.gp-tile .gp-icon { font-size: 2.2rem; display: block; margin-bottom: 0.4rem; }
.gp-offer { padding: 0.6rem 0.9rem; text-align: center; margin-bottom: 1rem; }

.gp-footer {
  max-width: 560px;
  margin: 2rem auto 1rem;
  padding: var(--gp-panel-pad, 0) 1rem;
  font-size: 0.78rem;
  color: var(--gp-muted);
  text-align: center;
}
.gp-footer p { margin: 0.3rem 0; }

@media (max-width: 400px) {
  .gp-wrap { padding: 1rem 0.75rem 2.5rem; }
  h1 { font-size: 1.25rem; }
}
</style>
<style id="gp-theme">
:root {
  --gp-bg: linear-gradient(rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.42)), url("https://m44ward.github.io/m44links/InGreenPastures3.png");
  --gp-panel: rgba(255, 255, 255, 0.92);
  --gp-panel-radius: 14px;
  --gp-panel-pad: 1rem;
  --gp-panel-top: 1.5rem;
}
</style>
</head>
<body>
<main class="gp-wrap">
  <header class="gp-head">
    <p class="gp-ward">Mapleton 44th Ward</p>
    <h1>Your Sign-up</h1>
  </header>
  <div id="gp-main"><p class="gp-loading">Loading…</p></div>
</main>
<footer class="gp-footer" id="gp-footer">
  <p>This page is an independent tool made by Church members. It is not an official product of, or sponsored by, The Church of Jesus Christ of Latter-day Saints.</p>
  <p class="gp-contact">Contact: <a href="mailto:m44bishopric@gmail.com">m44bishopric@gmail.com</a></p>
</footer>
<script>
/* Service Portal page code, shared by every page (inlined by build.mjs).
   Hub pages talk to the web app with fetch; the fallback pages served by the script itself use
   google.script.run. Data only ever reaches the page through textContent, never as HTML. */
var GP = (function () {
  'use strict';
  var cfg = { page: '', wardName: '', webAppUrl: '', contact: '', fallback: false };
  var GET_ACTIONS = { serve: true, post: true, help: true };
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var AUDIENCES = ['Brothers', 'Sisters', 'Youth', 'Children'];

  function init(c) {
    cfg = {
      page: c.page || '',
      wardName: c.wardName || '',
      webAppUrl: c.webAppUrl || '',
      contact: c.contact || '',
      fallback: !!c.fallback,
    };
    return cfg;
  }

  function config() {
    return cfg;
  }

  // ---------- talking to the script ----------

  function call(action, data) {
    data = data || {};
    var req = { action: action };
    Object.keys(data).forEach(function (k) {
      req[k] = data[k];
    });
    if (cfg.fallback) {
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).gpApi(req);
      });
    }
    var opts;
    var url = cfg.webAppUrl;
    if (GET_ACTIONS[action]) {
      url += '?api=' + encodeURIComponent(action) + (data.p ? '&p=' + encodeURIComponent(data.p) : '');
      opts = { method: 'GET', redirect: 'follow' };
    } else {
      // A text/plain body keeps this a "simple" request: no preflight.
      opts = { method: 'POST', body: JSON.stringify(req), redirect: 'follow' };
    }
    return fetch(url, opts).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    });
  }

  function parseHash(h) {
    var out = {};
    String(h || '')
      .replace(/^#/, '')
      .split('&')
      .forEach(function (part) {
        if (!part) return;
        var i = part.indexOf('=');
        var k = i < 0 ? part : part.slice(0, i);
        var v = i < 0 ? '' : part.slice(i + 1);
        try {
          out[decodeURIComponent(k)] = decodeURIComponent(v);
        } catch (e) {
          out[k] = v;
        }
      });
    return out;
  }

  function hash() {
    if (cfg.fallback) {
      return new Promise(function (resolve) {
        google.script.url.getLocation(function (loc) {
          resolve(parseHash(loc.hash));
        });
      });
    }
    return Promise.resolve(parseHash(window.location.hash));
  }

  function hashString(h) {
    return Object.keys(h || {})
      .map(function (k) {
        return k + '=' + encodeURIComponent(h[k]);
      })
      .join('&');
  }

  /** Address of another portal page: hub file, or the web app's ?page= in the fallback. */
  function pageUrl(page, h) {
    var tail = hashString(h);
    var base = cfg.fallback ? cfg.webAppUrl + '?page=' + page : page + '.html';
    return base + (tail ? '#' + tail : '');
  }

  // ---------- DOM ----------

  /** el('a', {href: x, class: 'y', onclick: fn}, ['text', node]) — text only via textContent. */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k.slice(0, 2) === 'on' && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'value') node.value = v;
      else if (k === 'checked') node.checked = !!v;
      else if (k === 'href') node.setAttribute('href', safeHref(v));
      else node.setAttribute(k, v === true ? '' : String(v));
    });
    (Array.isArray(children) ? children : children === undefined ? [] : [children]).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    });
    return node;
  }

  function safeHref(v) {
    var s = String(v);
    return /^(https?:|mailto:|[a-z0-9-]+\.html|#|\?)/i.test(s) ? s : '#';
  }

  function $(id) {
    return document.getElementById(id);
  }

  function clear(node) {
    node.innerHTML = '';
    return node;
  }

  function show(node, children) {
    clear(node);
    (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c) node.appendChild(c);
    });
  }

  function message(kind, text) {
    return el('div', { class: kind === 'ok' ? 'gp-ok' : 'gp-alert', role: kind === 'ok' ? 'status' : 'alert' }, text);
  }

  /** Turns the footer's contact into a mail link, or hides it when there is no contact. */
  function footer() {
    var f = $('gp-footer');
    if (!f) return;
    var c = f.querySelector('.gp-contact');
    if (c && !cfg.contact) c.className += ' gp-hidden';
  }

  function unreachable(page) {
    var url = cfg.webAppUrl + '?page=' + page + (window.location && window.location.hash ? window.location.hash : '');
    return el('div', { class: 'gp-alert', role: 'alert' }, [
      "Can't load right now. Try this link instead: ",
      el('a', { href: url }, url),
    ]);
  }

  function errorText(res) {
    return (res && res.error) || 'Something went wrong. Please try again.';
  }

  function copyText(text, button) {
    function done() {
      if (button) {
        var old = button.textContent;
        button.textContent = 'Copied';
        setTimeout(function () {
          button.textContent = old;
        }, 1500);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {
        window.prompt('Copy this link:', text);
      });
    } else {
      window.prompt('Copy this link:', text);
    }
  }

  // ---------- pure helpers ----------

  function isDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var d = new Date(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)));
    return d.getUTCMonth() === +s.slice(5, 7) - 1 && d.getUTCDate() === +s.slice(8, 10);
  }

  function utc(s) {
    return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  }

  function iso(ms) {
    var d = new Date(ms);
    var m = d.getUTCMonth() + 1;
    var day = d.getUTCDate();
    return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }

  /** Every date from start to end (inclusive) on the given weekdays (0 = Sunday; none = all). At most 100. */
  function expandDates(start, end, weekdays) {
    if (!isDate(start) || !isDate(end)) return [];
    var days = weekdays && weekdays.length ? weekdays.map(Number) : [0, 1, 2, 3, 4, 5, 6];
    var out = [];
    for (var t = utc(start); t <= utc(end) && out.length < 100; t += 86400000) {
      if (days.indexOf(new Date(t).getUTCDay()) >= 0) out.push(iso(t));
    }
    return out;
  }

  /** {Brothers: [], Sisters: [], Youth: [], Children: []}; full posts last in each group. */
  function groupByAudience(posts) {
    var out = {};
    AUDIENCES.forEach(function (a) {
      out[a] = [];
    });
    (posts || []).forEach(function (p) {
      (p.audiences || []).forEach(function (a) {
        if (out[a]) out[a].push(p);
      });
    });
    AUDIENCES.forEach(function (a) {
      out[a] = out[a]
        .filter(function (p) {
          return !p.full;
        })
        .concat(
          out[a].filter(function (p) {
            return p.full;
          })
        );
    });
    return out;
  }

  /** 'Thu, Dec 3' */
  function fmtDate(s) {
    if (!isDate(s)) return String(s || '');
    var d = new Date(utc(s));
    return DAYS[d.getUTCDay()] + ', ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate();
  }

  /** '6:30 PM' */
  function fmtTime(t) {
    if (!/^\d{2}:\d{2}$/.test(String(t || ''))) return '';
    var h = +t.slice(0, 2);
    return (h % 12 === 0 ? 12 : h % 12) + ':' + t.slice(3) + (h < 12 ? ' AM' : ' PM');
  }

  function fmtTimes(start, end) {
    if (!start) return '';
    return fmtTime(start) + (end ? '–' + fmtTime(end) : '');
  }

  function fillBar(filled, needed) {
    var pct = needed ? Math.min(100, Math.round((filled / needed) * 100)) : 0;
    return el('div', { class: 'gp-bar', role: 'img', 'aria-label': filled + ' of ' + needed + ' filled' }, [
      el('span', { style: 'width:' + pct + '%' }),
    ]);
  }

  return {
    init: init,
    config: config,
    call: call,
    hash: hash,
    parseHash: parseHash,
    pageUrl: pageUrl,
    el: el,
    $: $,
    clear: clear,
    show: show,
    message: message,
    footer: footer,
    unreachable: unreachable,
    errorText: errorText,
    copyText: copyText,
    expandDates: expandDates,
    groupByAudience: groupByAudience,
    fmtDate: fmtDate,
    fmtTime: fmtTime,
    fmtTimes: fmtTimes,
    fillBar: fillBar,
    isDate: isDate,
    AUDIENCES: AUDIENCES,
  };
})();
</script>
<script>
GP.init({ page: 'confirm', wardName: "Mapleton 44th Ward", webAppUrl: "https://script.google.com/macros/s/AKfycbySauHR35xOP-hSjgyfDdCkk6qwRDw-YMJyo-i2ykfP-s3zcgnNpJBTzZSZLYs5bZR1/exec", contact: "m44bishopric@gmail.com", fallback: false });
GP.footer();
(function () {
  var el = GP.el;
  var main = GP.$('gp-main');
  GP.hash().then(function (h) {
    if (!h.t) return GP.show(main, GP.message('alert', 'This link is missing part of its address. Open it again from your email.'));
    // One page for three kinds of emailed link: confirm your address, withdraw an offer, cancel.
    var KINDS = {
      confirm: { action: 'confirm', label: 'Confirm my address', cls: '', intro: 'Please confirm this is your email address so your sign-up can go ahead.' },
      withdraw: { action: 'withdraw', label: 'Withdraw my offer', cls: 'gp-danger', intro: 'This role already has the people it needs. You may stay signed up, or withdraw your offer below.' },
      cancel: { action: 'cancel', label: 'Cancel my sign-up', cls: 'gp-danger', intro: "Can't make it? Cancel below so someone else can take your place." },
    };
    var ACTIVE = { Confirmed: true, 'Waiting-email': true, 'Waiting-approval': true };
    GP.call('tokenInfo', { t: h.t }).then(
      function (res) {
        if (!res || !res.ok) return GP.show(main, GP.message('alert', GP.errorText(res)));
        var kind = KINDS[res.kind] || KINDS.cancel;
        var when = GP.fmtDate(res.date) + (res.start ? ', ' + GP.fmtTime(res.start) : '');
        var info = el('div', { class: 'gp-card' }, [el('h3', {}, res.title), el('p', {}, res.role + ' · ' + when)]);
        if (res.kind === 'confirm' && res.confirmed) return GP.show(main, [info, GP.message('ok', 'Your address is already confirmed.')]);
        if (res.kind === 'withdraw' && res.status !== 'Confirmed') return GP.show(main, [info, GP.message('ok', 'This sign-up is no longer active.')]);
        if (res.kind === 'cancel' && !ACTIVE[res.status]) return GP.show(main, [info, GP.message('ok', 'This sign-up is already cancelled.')]);
        var out = el('div');
        // The change happens only on this click (email scanners open links but never press buttons).
        var button = el(
          'button',
          {
            type: 'button',
            class: kind.cls,
            onclick: function () {
              button.disabled = true;
              GP.call(kind.action, { t: h.t }).then(
                function (r) {
                  if (r && r.ok) return GP.show(main, [info, GP.message('ok', r.message)]);
                  button.disabled = false;
                  GP.show(out, GP.message('alert', GP.errorText(r)));
                },
                function () {
                  button.disabled = false;
                  GP.show(out, GP.unreachable('confirm'));
                }
              );
            },
          },
          kind.label
        );
        GP.show(main, [info, el('p', {}, kind.intro), el('p', {}, [button]), out]);
      },
      function () {
        GP.show(main, GP.unreachable('confirm'));
      }
    );
  });
})();
</script>
</body>
</html>
